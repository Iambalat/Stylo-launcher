name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Recreer le projet
        run: |
          echo "" | base64 -d > p.zip
          unzip -q p.zip
      - name: Build
        working-directory: StyloLauncher
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StyloLauncher-APK
          path: StyloLauncher/app/build/outputs/apk/debug/app-debug.apk
